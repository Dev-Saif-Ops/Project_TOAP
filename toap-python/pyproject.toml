[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toap"
version = "0.1.1"
description = "Token-Optimized Agent Protocol — middleware for compressed AI agent communication"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mohammad Safwan Athar" }]
keywords = ["ai", "agents", "llm", "token-optimization", "langchain", "crewai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
"langchain-gemini" = ["langchain-core>=0.2.0", "langchain-google-genai>=2.0.0", "python-dotenv>=1.0.0"]
crewai = ["crewai>=0.28.0"]
"crewai-gemini" = ["crewai>=0.28.0", "python-dotenv>=1.0.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]
all = ["langchain-core>=0.2.0", "crewai>=0.28.0", "pytest>=8.0"]

[project.scripts]
toap-cli = "toap.cli:main"

[project.urls]
Homepage = "https://github.com/project-toap/toap-python"
Documentation = "https://github.com/project-toap/toap-python#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/toap"]

[tool.hatch.build.targets.sdist]
include = ["src/toap", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
